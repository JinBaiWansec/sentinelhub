{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 460px;">
  <h2>Sign in</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" placeholder="username" value="admin">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="password" value="admin123">
    <label for="next">Next (optional)</label>
    <input id="next" name="next" placeholder="/dashboard">
    <div style="margin-top:1rem;">
      <button class="btn" type="submit">Sign in</button>
    </div>
  </form>
  <p class="muted" style="margin-top:1rem;">Default admin / member accounts are seeded.</p>
</div>
{% endblock %}
